# Publishes @jsx-contracts/eslint-plugin to npm when a v* tag is pushed (tags are
# created by `pnpm release`, see scripts/release.ts). Auth is npm trusted
# publishing over OIDC — no token secret; the trusted publisher is configured on
# npmjs for this repo + workflow. id-token: write mints the OIDC token and backs
# provenance (provenance needs the repo to be public to resolve visibility).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Check tag matches package version
        run: node scripts/check-release-tag.ts "$GITHUB_REF_NAME"

      - run: pnpm -r stage publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
